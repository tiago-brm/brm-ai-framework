[project]
name = "brm-ai-framework"
version = "0.1.0"
description = "BRM Framework — MCP engine, rule evaluator, and vault for BRM Solutions clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
