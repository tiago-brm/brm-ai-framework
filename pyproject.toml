[project]
name = "brm-ai-framework"
version = "0.1.0"
description = "BRM Framework — MCP engine, rule evaluator, and vault for BRM Solutions clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=3.0.1",
    "anthropic>=1.2.0",
    "json-logic-qubit>=0.9.1",
    "mcp>=0.8.0,<2",
    "pydantic>=2.13.4",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
    "sqlite-vec>=0.1.9",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
