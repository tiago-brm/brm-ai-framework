schema_version: 1
client_id: example
skills:
- name: enviar_email
  description: Envia e-mails do escritório (ex. atualização processual, notificação
    ao cliente)
  method: POST
  url_template: https://mail.example.com/api/send
  allowed_domains:
  - mail.example.com
  parameters:
    destinatario:
      type: string
      required: true
    assunto:
      type: string
      required: true
    corpo:
      type: string
      required: true
  timeout_seconds: 30.0
- name: consultar_erp
  description: Queries the legacy ERP for financial data
  method: GET
  url_template: https://erp-internal.example.com/api/consultas
  allowed_domains:
  - erp-internal.example.com
  parameters:
    filtro:
      type: string
    data_inicio:
      type: string
  timeout_seconds: 60.0
- name: registrar_documento
  description: Records a document in the internal registry system
  method: POST
  url_template: https://sistema-registros.example.com/v1/docs
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    titulo:
      type: string
      required: true
    conteudo:
      type: string
      required: true
    tags:
      type: array
  timeout_seconds: 45.0
- name: consulta-andamento-processual
  description: Consulta o andamento de um processo no sistema de registros do escritório
    dado o número do processo
  method: GET
  url_template: https://sistema-registros.example.com/api/processos/{numero_processo}/andamento
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    numero_processo:
      description: Número do processo a ser consultado
      required: true
      type: string
  timeout_seconds: 30.0
- name: protocolar_peca_processual
  description: Protocola uma peça processual (petição, contestação, recurso etc.)
    no sistema de registros do escritório, enviando o conteúdo final da peça.
  method: POST
  url_template: https://sistema-registros.example.com/api/processos/{numero_processo}/pecas
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    conteudo:
      description: Conteúdo completo da peça processual
      required: true
      type: string
    numero_processo:
      description: Número do processo judicial
      required: true
      type: string
    tipo_peca:
      description: Tipo da peça processual (petição, contestação, recurso, etc.)
      required: true
      type: string
  timeout_seconds: 30.0
- name: agendar_audiencia
  description: Registra a data de uma nova audiência no sistema de registros do escritório
  method: POST
  url_template: https://sistema-registros.example.com/api/audiencias
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    data_audiencia:
      description: Data da audiência
      required: true
      type: string
    numero_processo:
      description: Número do processo judicial
      required: true
      type: string
    tipo_audiencia:
      description: Tipo da audiência
      required: true
      type: string
  timeout_seconds: 30.0
- name: arquivar_processo
  description: Marca um processo como arquivado no sistema de registros do escritório
  method: POST
  url_template: https://sistema-registros.example.com/api/processos/{numero_processo}/arquivar
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    motivo:
      description: Motivo do arquivamento
      required: true
      type: string
    numero_processo:
      description: Número do processo a ser arquivado
      required: true
      type: string
  timeout_seconds: 30.0
- name: reagendar_audiencia
  description: Integração para alterar a data de uma audiência já marcada no sistema
    de registros do escritório
  method: PATCH
  url_template: https://sistema-registros.example.com/api/audiencias/{numero_processo}
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    motivo:
      description: Motivo do reagendamento
      required: true
      type: string
    nova_data_audiencia:
      description: Nova data para a audiência
      required: true
      type: string
    numero_processo:
      description: Número do processo da audiência a ser reagendada
      required: true
      type: string
  timeout_seconds: 30.0
- name: registrar_pagamento_honorario
  description: Registra a baixa de um pagamento de honorário recebido, atualizando
    o status do contrato no sistema de registros do escritório
  method: POST
  url_template: https://sistema-registros.example.com/api/pagamentos/honorarios
  allowed_domains:
  - sistema-registros.example.com
  parameters:
    cliente:
      description: Nome ou identificador do cliente
      required: true
      type: string
    numero_contrato:
      description: Número do contrato associado ao pagamento
      required: true
      type: string
    valor_pago:
      description: Valor do pagamento de honorário recebido
      required: true
      type: string
  timeout_seconds: 30.0
- name: cobrar_honorario_atrasado
  description: Envia uma cobrança por e-mail ao cliente quando um contrato de honorários
    está em atraso
  method: POST
  url_template: https://mail.example.com/api/send
  allowed_domains:
  - mail.example.com
  parameters:
    cliente:
      description: Nome do cliente
      required: true
      type: string
    destinatario:
      description: E-mail do cliente
      required: true
      type: string
    dias_atraso:
      description: Dias desde o vencimento
      required: true
      type: number
    valor:
      description: Valor em atraso
      required: true
      type: string
  timeout_seconds: 30.0
- name: notificar_cliente_movimentacao
  description: Envia e-mail ao cliente notificando sobre nova movimentação relevante
    no processo
  method: POST
  url_template: https://mail.example.com/api/send
  allowed_domains:
  - mail.example.com
  parameters:
    destinatario:
      description: E-mail do cliente destinatário
      required: true
      type: string
    numero_processo:
      description: Número do processo judicial
      required: true
      type: string
    resumo_movimentacao:
      description: Resumo em linguagem simples da movimentação processual
      required: true
      type: string
  timeout_seconds: 30.0
