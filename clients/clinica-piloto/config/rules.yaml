schema_version: 1
client_id: clinica-piloto
rules:
- id: comissao-so-admin
  description: Comissão, repasse e quanto cada profissional ganha são restritos ao administrador. Vale
    para qualquer consulta de repasse, taxa ou parte da clínica e para o bônus de indicação.
  condition:
    and:
    - ==:
      - var: skill_name
      - consultar_financeiro
    - '!':
      - in:
        - var: actor_role
        - - admin
          - super_admin
    - in:
      - var: consulta
      - - repasse_por_profissional
        - simular_repasse
        - parte_clinica
        - taxas_por_meio
  effect: deny
  message: Comissão, repasse e ganhos de profissionais são restritos ao administrador.
  next_step: Peça ao administrador da clínica.
- id: bonus-indicacao-so-admin
  description: A política e a aptidão do bônus de indicação são remuneração de profissionais e só o
    administrador consulta.
  condition:
    and:
    - ==:
      - var: skill_name
      - agenda_bonus_indicacao
    - '!':
      - in:
        - var: actor_role
        - - admin
          - super_admin
  effect: deny
  message: O bônus de indicação e a aptidão dos profissionais são restritos ao administrador.
  next_step: Peça ao administrador da clínica.
- id: faturamento-so-admin
  description: Faturamento, resultado e relatórios financeiros da clínica são do administrador. Quem
    não é administrador só consulta o que é operacional da recepção (lista de permitidos); consulta
    nova nasce negada até entrar na lista.
  condition:
    and:
    - ==:
      - var: skill_name
      - consultar_financeiro
    - '!':
      - in:
        - var: actor_role
        - - admin
          - super_admin
    - '!':
      - in:
        - var: consulta
        - - a_receber
          - saldo_pacote
          - faltas_por_periodo
          - pendencias
          - sem_nf
          - ultimos_lancamentos
  effect: deny
  message: Faturamento, resultado e relatórios financeiros da clínica são restritos ao administrador.
  next_step: Peça ao administrador da clínica.
- id: planilha-so-admin
  description: Toda exportação de planilha (financeira ou das secretarias) é do administrador. As
    planilhas serão descontinuadas pelo módulo novo da Agenda; até lá só o administrador exporta.
  condition:
    and:
    - ==:
      - var: skill_name
      - exportar_planilha
    - '!':
      - in:
        - var: actor_role
        - - admin
          - super_admin
  effect: deny
  message: A exportação de planilhas é restrita ao administrador.
  next_step: Peça ao administrador da clínica.
- id: lancamento-em-mes-fechado
  description: Lançar em mês já fechado é recusado; o ajuste entra no mês corrente. O banco também
    recusa, esta regra só dá a mensagem antes.
  condition:
    and:
    - in:
      - var: skill_name
      - - registrar_recebimento
        - registrar_despesa
    - ==:
      - var: mes_fechado
      - true
  effect: deny
  message: Mês fechado. O lançamento não é aceito.
  next_step: Lance o ajuste no mês corrente, com referência ao lançamento original.
- id: reabrir-mes-so-super-admin
  description: Reabrir mês fechado é exceção do super_admin, sempre auditada.
  condition:
    and:
    - ==:
      - var: skill_name
      - reabrir_mes
    - '!=':
      - var: actor_role
      - super_admin
  effect: deny
  message: Apenas o super_admin reabre um mês fechado.
  next_step: Peça ao super_admin, informando o motivo.
- id: lancamento-atipico-exige-gestor
  description: Recebimento com valor atípico, retroativo (mais de 7 dias) ou de paciente a confirmar,
    lançado por perfil comum, exige aprovação do gestor.
  condition:
    and:
    - ==:
      - var: skill_name
      - registrar_recebimento
    - ==:
      - var: actor_role
      - viewer
    - or:
      - ==:
        - var: valor_atipico
        - true
      - '>':
        - var: retroativo_dias
        - 7
      - ==:
        - var: paciente_a_confirmar
        - true
  effect: require_approval
  aprovador: admin
  message: 'Lançamento fora do padrão (valor atípico, retroativo ou paciente a confirmar): o gestor
    precisa aprovar.'
  next_step: O gestor confere o resumo e aprova a operação.
- id: despesa-retroativa-exige-gestor
  description: Despesa retroativa (mais de 7 dias) lançada por perfil comum exige aprovação do gestor.
  condition:
    and:
    - ==:
      - var: skill_name
      - registrar_despesa
    - ==:
      - var: actor_role
      - viewer
    - '>':
      - var: retroativo_dias
      - 7
  effect: require_approval
  aprovador: admin
  message: 'Despesa retroativa: o gestor precisa aprovar.'
  next_step: O gestor confere o resumo e aprova a operação.
- id: duplicidade-confirmada-exige-gestor
  description: Lançar valor idêntico já existente (confirmar_duplicidade) por perfil
    comum exige aprovação do gestor.
  condition:
    and:
    - in:
      - var: skill_name
      - - registrar_recebimento
        - registrar_despesa
    - ==:
      - var: confirmar_duplicidade
      - true
    - ==:
      - var: actor_role
      - viewer
  effect: require_approval
  aprovador: admin
  message: 'Lançamento igual a outro já existente: o gestor precisa aprovar.'
  next_step: O gestor confere e aprova a operação.
- id: pendencia-so-gestor
  description: Resolver pendências é do gestor.
  condition:
    and:
    - ==:
      - var: skill_name
      - resolver_pendencia
    - ==:
      - var: actor_role
      - viewer
  effect: deny
  message: Resolver pendências é restrito ao gestor.
  next_step: Peça ao gestor.
- id: contrato-antes-do-pacote
  description: (Exemplo, spec 035) Depois da primeira sessão concluída, vender pacote exige contrato
    emitido. A exceção é liberada pelo gestor e fica auditada. Troque o efeito para deny se a
    clínica quiser bloqueio sem exceção.
  condition:
    and:
    - in:
      - var: skill_name
      - - registrar_pacote
    - ==:
      - var: primeira_sessao_concluida
      - true
    - ==:
      - var: contrato_emitido
      - false
  effect: require_approval
  aprovador: admin
  message: O paciente já fez a primeira sessão e ainda não tem contrato emitido.
  next_step: Emita o contrato pela Central de Ações ou peça a liberação do gestor.
