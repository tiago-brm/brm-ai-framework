schema_version: 1
client_id: instituto-afw
skills:
- name: consultar_prontuario
  description: Abre o prontuário de um paciente para o profissional com vínculo (consulta, resumo das
    últimas sessões, tarefa pendente). Use quando o usuário pedir histórico, evolução ou resumo de um
    paciente.
  method: GET
  url_template: https://sistema-clinica.example.com/api/pacientes/{paciente_id}/prontuario
  allowed_domains:
  - sistema-clinica.example.com
  parameters:
    paciente_id:
      description: ID do paciente, por exemplo PAC-001. Se o usuário citar só o nome, a queixa ou o psicólogo,
        ache o ID com vault_search.
      required: true
      type: string
  timeout_seconds: 30.0
  derived_facts:
    vinculo_com_paciente:
      vault_match:
        paciente_id: $paciente_id
        tipo: prontuario
      field: psicologo_responsavel
      transform: equals_actor
      if_true: sim
      if_false: nao
      if_missing: nao
  examples:
  - Resuma as últimas sessões do PAC-001
  - Como está o paciente com ansiedade de avaliação?
  - O que ficou de tarefa para a próxima sessão do PAC-005?
- name: emitir_declaracao_comparecimento
  description: Emite declaração de comparecimento (dia, horário e duração do atendimento). Nunca inclui
    sintomas ou estado psicológico. Use para pedidos de comprovante de presença.
  method: POST
  url_template: https://sistema-clinica.example.com/api/pacientes/{paciente_id}/declaracoes
  allowed_domains:
  - sistema-clinica.example.com
  parameters:
    paciente_id:
      description: ID do paciente, por exemplo PAC-001. Se o usuário citar só o nome, a queixa ou o psicólogo,
        ache o ID com vault_search.
      required: true
      type: string
    finalidade:
      description: Para que o documento será usado, por exemplo trabalho ou escola.
      required: true
      type: string
    incluir_sintomas:
      description: true somente se o pedido incluir sintomas, diagnóstico ou estado psicológico; numa
        declaração comum é false.
      type: boolean
  timeout_seconds: 30.0
  examples:
  - Preciso de uma declaração de comparecimento do PAC-001 para o trabalho
  - Emita a declaração dizendo que ele está com ansiedade
- name: emitir_relatorio_psicologico
  description: Gera o rascunho de um relatório psicológico a partir do prontuário. Só o psicólogo responsável
    emite, e o documento só é entregue depois da revisão e da entrevista devolutiva.
  method: POST
  url_template: https://sistema-clinica.example.com/api/pacientes/{paciente_id}/relatorios
  allowed_domains:
  - sistema-clinica.example.com
  parameters:
    paciente_id:
      description: ID do paciente, por exemplo PAC-001. Se o usuário citar só o nome, a queixa ou o psicólogo,
        ache o ID com vault_search.
      required: true
      type: string
    solicitante:
      description: 'Quem pediu o relatório: escola, convênio, médico ou família.'
      required: true
      type: string
    finalidade:
      description: Motivo do relatório.
      required: true
      type: string
  timeout_seconds: 60.0
  examples:
  - Faça o rascunho do relatório do PAC-002 para a escola
  - Preciso de um relatório de encaminhamento ao médico para o PAC-004
- name: entregar_prontuario_responsavel
  description: Entrega cópia do prontuário ao paciente adulto ou ao responsável legal. Para menor de idade
    exige conferência do responsável e aprovação do psicólogo.
  method: POST
  url_template: https://sistema-clinica.example.com/api/pacientes/{paciente_id}/entregas
  allowed_domains:
  - sistema-clinica.example.com
  parameters:
    paciente_id:
      description: ID do paciente, por exemplo PAC-001. Se o usuário citar só o nome, a queixa ou o psicólogo,
        ache o ID com vault_search.
      required: true
      type: string
    responsavel:
      description: Quem está recebendo a cópia, por exemplo o próprio paciente ou o nome e vínculo do
        responsável.
      required: true
      type: string
  timeout_seconds: 30.0
  derived_facts:
    paciente_menor:
      vault_match:
        paciente_id: $paciente_id
        tipo: prontuario
      field: faixa_etaria
      transform: in
      values:
      - crianca
      - adolescente
      if_true: true
      if_false: false
      if_missing: true
  examples:
  - O pai do PAC-002 pediu o prontuário do filho
  - O PAC-001 quer uma cópia do próprio prontuário
- name: enviar_lembrete_sessao
  description: Envia mensagem por WhatsApp ao paciente (lembrete de sessão, convite para remarcar). Não
    inclua dado clínico na mensagem.
  method: POST
  url_template: https://whatsapp-gateway.example.com/api/messages
  allowed_domains:
  - whatsapp-gateway.example.com
  parameters:
    telefone:
      description: Telefone do paciente no formato +55 DDD número.
      required: true
      type: string
    mensagem:
      description: Texto da mensagem, sem dado clínico.
      required: true
      type: string
  timeout_seconds: 30.0
  examples:
  - Avise o paciente que a sessão de amanhã às 15h está confirmada
  - Convide quem faltou para remarcar a sessão
- name: cobrar_mensalidade
  description: Envia cobrança de mensalidade atrasada por e-mail ao responsável financeiro. A recepção
    precisa de aprovação da gestão.
  method: POST
  url_template: https://mail.example.com/api/send
  allowed_domains:
  - mail.example.com
  parameters:
    destinatario:
      description: E-mail do responsável financeiro.
      required: true
      type: string
    valor:
      description: Valor em aberto, por exemplo R$ 480,00.
      required: true
      type: string
    dias_atraso:
      description: Dias de atraso.
      required: true
      type: number
    mensagem:
      description: Texto da cobrança, sem CPF ou dado clínico.
      type: string
  timeout_seconds: 30.0
  examples:
  - Cobre a mensalidade em atraso do PAC-005
- name: enviar_caso_supervisao
  description: Envia o caso clínico do aluno para a supervisão. O texto deve estar anonimizado; CPF e
    telefone são barrados automaticamente.
  method: POST
  url_template: https://plataforma-ensino.example.com/api/supervisao/casos
  allowed_domains:
  - plataforma-ensino.example.com
  parameters:
    aluno_id:
      description: ID do aluno, por exemplo ALU-017.
      required: true
      type: string
    trilha:
      description: Trilha da pós, por exemplo tcc ou terapia-do-esquema.
      type: string
    caso_texto:
      description: Texto do caso, anonimizado, sem nome, CPF ou telefone do paciente.
      required: true
      type: string
  timeout_seconds: 30.0
  examples:
  - Mande este caso anonimizado para a supervisão da minha trilha
- name: compartilhar_caso_grupo
  description: Libera um caso enviado para discussão no grupo de supervisão. Quando pedido por aluno,
    o supervisor revisa a anonimização antes.
  method: POST
  url_template: https://plataforma-ensino.example.com/api/supervisao/grupos/casos
  allowed_domains:
  - plataforma-ensino.example.com
  parameters:
    caso_id:
      description: ID do caso, por exemplo CASO-042.
      required: true
      type: string
  timeout_seconds: 30.0
  examples:
  - Leve o CASO-042 para o grupo
- name: buscar_aulas
  description: Pesquisa o conteúdo gravado das aulas da pós-graduação para responder dúvidas de alunos
    com matrícula ativa.
  method: GET
  url_template: https://plataforma-ensino.example.com/api/aulas/busca
  allowed_domains:
  - plataforma-ensino.example.com
  parameters:
    pergunta:
      description: Pergunta do aluno sobre o conteúdo das aulas.
      required: true
      type: string
    aluno_id:
      description: ID do aluno, por exemplo ALU-017.
      required: true
      type: string
    matricula:
      type: string
  timeout_seconds: 30.0
  derived_facts:
    matricula:
      vault_match:
        aluno_id: $aluno_id
        tipo: aluno
      field: matricula
      if_missing: inativa
  examples:
  - O que o professor falou sobre o modo Criança Vulnerável?
  vault_read:
    types:
    - aula
    query_from: pergunta
    limit: 2
- name: emitir_declaracao_horas
  description: Emite declaração de horas cursadas na pós-graduação. Exige frequência mínima do regimento.
  method: POST
  url_template: https://plataforma-ensino.example.com/api/alunos/{aluno_id}/declaracoes
  allowed_domains:
  - plataforma-ensino.example.com
  parameters:
    aluno_id:
      description: ID do aluno, por exemplo ALU-017.
      required: true
      type: string
    frequencia_percentual:
      type: number
  timeout_seconds: 30.0
  derived_facts:
    frequencia_percentual:
      vault_match:
        aluno_id: $aluno_id
        tipo: aluno
      field: frequencia_percentual
      if_missing: 0
  examples:
  - Emita a declaração de horas da aluna ALU-017
- name: responder_lead_whatsapp
  description: Responde a um interessado na pós-graduação pelo WhatsApp, usando o FAQ do vault. Se a resposta
    citar valor, desconto ou vaga, precisa de aprovação da secretaria.
  method: POST
  url_template: https://whatsapp-gateway.example.com/api/messages
  allowed_domains:
  - whatsapp-gateway.example.com
  parameters:
    telefone:
      description: Telefone do interessado no formato +55 DDD número.
      required: true
      type: string
    mensagem:
      description: Resposta ao interessado.
      required: true
      type: string
    menciona_valor_ou_vaga:
      description: true se a mensagem ou a pergunta tratar de valor, desconto, condição comercial ou vaga.
      type: boolean
  timeout_seconds: 30.0
  examples:
  - Responda quem pode participar da pós
  - Responda quanto custa e se tem vaga
  vault_read:
    types:
    - faq
    query_from: mensagem
    limit: 1
- name: publicar_post_turma
  description: Publica divulgação de turma da pós-graduação nas redes. O texto não pode prometer resultado
    ou cura.
  method: POST
  url_template: https://redes-sociais.example.com/api/posts
  allowed_domains:
  - redes-sociais.example.com
  parameters:
    trilha:
      description: Trilha divulgada.
      type: string
    texto:
      description: Texto do post.
      required: true
      type: string
    promete_resultado:
      description: true se o texto prometer resultado, cura ou garantia a quem fizer o curso.
      type: boolean
  timeout_seconds: 30.0
  examples:
  - Publique um post sobre a turma de Terapia do Esquema
- name: consultar_painel_clinica
  description: Mostra o painel agregado da clínica (sessões, faltas e adesão por psicólogo e unidade),
    sem identificar pacientes. Restrito à responsável técnica.
  method: GET
  url_template: https://sistema-clinica.example.com/api/painel
  allowed_domains:
  - sistema-clinica.example.com
  parameters:
    periodo:
      description: Mês no formato AAAA-MM.
      type: string
  timeout_seconds: 30.0
  examples:
  - Como foi o mês de setembro por psicólogo?
